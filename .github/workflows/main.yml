name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest

    # 360 minutes = 6 hours
    timeout-minutes: 360

    steps:

      # ============================================================
      # 01 - INITIALIZE RUNNER
      # ============================================================
      - name: "01 | Initialize Runner"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 GITHUB RDP SERVER"
          Write-Host "============================================================"
          Write-Host ""

          $computer = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor

          $hostname = $env:COMPUTERNAME
          $cpuName = ($cpu | Select-Object -First 1).Name
          $cores = ($cpu | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum

          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          Write-Host "[RUNNER]"
          Write-Host "  Hostname       : $hostname"
          Write-Host "  Repository     : $env:GITHUB_REPOSITORY"
          Write-Host "  Run ID         : $env:GITHUB_RUN_ID"
          Write-Host "  OS             : $($os.Caption)"
          Write-Host "  Architecture   : $($os.OSArchitecture)"
          Write-Host "  CPU            : $cpuName"
          Write-Host "  Logical Cores  : $cores"
          Write-Host "  RAM            : $ramGB GB"
          Write-Host ""

          Write-Host "[STORAGE]"

          $disks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"

          foreach ($disk in $disks) {
              $free = [math]::Round($disk.FreeSpace / 1GB, 2)
              $total = [math]::Round($disk.Size / 1GB, 2)

              Write-Host "  $($disk.DeviceID)  : $free GB free / $total GB total"
          }

          Write-Host ""
          Write-Host "[WORKFLOW]"
          Write-Host "  Maximum Runtime : 6 Hours"
          Write-Host "  Status          : INITIALIZED"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 02 - CONFIGURE RDP
      # ============================================================
      - name: "02 | Configure RDP"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP CONFIGURATION"
          Write-Host "============================================================"

          Write-Host "[1/4] Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Write-Host "[2/4] Configuring RDP authentication..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          Write-Host "[3/4] Configuring firewall..."

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389

          Write-Host "[4/4] Restarting Remote Desktop service..."

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host ""
          Write-Host "RDP Status : CONFIGURED"
          Write-Host "RDP Port   : 3389"
          Write-Host "Status     : SUCCESS"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 03 - CREATE RDP USER
      # ============================================================
      - name: "03 | Create RDP User"
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  RDP USER CONFIGURATION"
          Write-Host "============================================================"

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if (
              [string]::IsNullOrWhiteSpace($username) -or
              [string]::IsNullOrWhiteSpace($password)
          ) {
              Write-Error "RDP_USERNAME or RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Checking RDP account..."

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "Account already exists."
              Write-Host "Updating account password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePass

          }
          else {

              Write-Host "Creating RDP account..."

              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          Write-Host "Adding account to Administrators..."

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Adding account to Remote Desktop Users..."

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Username : [HIDDEN]"
          Write-Host "Password : [HIDDEN]"
          Write-Host "Status   : USER CONFIGURED"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 04 - INSTALL TAILSCALE
      # ============================================================
      - name: "04 | Install Tailscale"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                   TAILSCALE INSTALLATION"
          Write-Host "============================================================"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer was not downloaded."
              exit 1
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed. Exit code: $($process.ExitCode)"
              exit 1
          }

          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found after installation."
              exit 1
          }

          $version = & $tailscale version | Select-Object -First 1

          Write-Host ""
          Write-Host "Tailscale : INSTALLED"
          Write-Host "Version   : $version"
          Write-Host "Status    : SUCCESS"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 05 - CONNECT TAILSCALE
      # ============================================================
      - name: "05 | Connect Tailscale"
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  TAILSCALE CONNECTION"
          Write-Host "============================================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Hostname : $hostname"
          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale failed to connect."
              exit 1
          }

          Write-Host "Tailscale connection established."

          $tsIP = $null

          for ($i = 1; $i -le 12; $i++) {

              $tsIP = (
                  & $tailscale ip -4 2>$null |
                  Select-Object -First 1
              ).Trim()

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale IP... Attempt $i/12"
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "TAILSCALE"
          Write-Host "  Status   : CONNECTED"
          Write-Host "  IPv4     : $tsIP"
          Write-Host "  Hostname : $hostname"
          Write-Host ""
          Write-Host "Status : SUCCESS"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 06 - VERIFY RDP
      # ============================================================
      - name: "06 | Verify RDP"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    RDP CONNECTIVITY TEST"
          Write-Host "============================================================"

          Write-Host "Target IP : $env:TAILSCALE_IP"
          Write-Host "Port      : 3389"
          Write-Host ""
          Write-Host "Testing TCP connectivity..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host ""
          Write-Host "RDP Port : ACCESSIBLE"
          Write-Host "TCP Test : SUCCESS"
          Write-Host "Status   : RDP SERVER READY"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 07 - RDP READY SUMMARY
      # ============================================================
      - name: "07 | RDP Ready Summary"
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP SERVER IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[CONNECTION]"
          Write-Host "  Address  : $env:TAILSCALE_IP"
          Write-Host "  Port     : 3389"
          Write-Host "  Username : [HIDDEN]"
          Write-Host "  Password : [HIDDEN]"
          Write-Host ""
          Write-Host "[TAILSCALE]"
          Write-Host "  Status   : CONNECTED"
          Write-Host "  IPv4     : $env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "[WORKFLOW]"
          Write-Host "  Repository     : $env:GITHUB_REPOSITORY"
          Write-Host "  Run ID         : $env:GITHUB_RUN_ID"
          Write-Host "  Maximum Runtime: 6 Hours"
          Write-Host ""
          Write-Host "  STATUS         : ONLINE"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 08 - LIVE MONITOR
      # ============================================================
      - name: "08 | RDP Live Monitor"
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    LIVE SYSTEM MONITOR"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Updates every 5 minutes."
          Write-Host "Workflow maximum runtime: 6 hours."
          Write-Host ""

          $startTime = Get-Date

          while ($true) {

              # ----------------------------------------------------
              # TIME
              # ----------------------------------------------------
              $now = Get-Date
              $utcNow = $now.ToUniversalTime()

              $istZone = [System.TimeZoneInfo]::FindSystemTimeZoneById(
                  "India Standard Time"
              )

              $istNow = [System.TimeZoneInfo]::ConvertTimeFromUtc(
                  $utcNow,
                  $istZone
              )

              $utcStr = $utcNow.ToString("HH:mm:ss")
              $istStr = $istNow.ToString("HH:mm:ss")

              # ----------------------------------------------------
              # UPTIME
              # ----------------------------------------------------
              $uptime = $now - $startTime

              $uptimeStr = "{0:hh\:mm\:ss}" -f $uptime

              # ----------------------------------------------------
              # CPU
              # ----------------------------------------------------
              $cpuLoad = (
                  Get-CimInstance Win32_Processor |
                  Measure-Object `
                    -Property LoadPercentage `
                    -Average
              ).Average

              $cpuLoad = [math]::Round($cpuLoad, 1)

              # ----------------------------------------------------
              # RAM
              # ----------------------------------------------------
              $osInfo = Get-CimInstance Win32_OperatingSystem

              $freeRam = [math]::Round(
                  $osInfo.FreePhysicalMemory / 1MB,
                  2
              )

              $totalRam = [math]::Round(
                  $osInfo.TotalVisibleMemorySize / 1MB,
                  2
              )

              $ramUsed = $totalRam - $freeRam

              $ramUsagePercent = [math]::Round(
                  ($ramUsed / $totalRam) * 100,
                  1
              )

              # ----------------------------------------------------
              # STORAGE
              # ----------------------------------------------------
              $storageStatus = @()

              $disks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3"

              foreach ($disk in $disks) {

                  $free = [math]::Round(
                      $disk.FreeSpace / 1GB,
                      1
                  )

                  $total = [math]::Round(
                      $disk.Size / 1GB,
                      1
                  )

                  $storageStatus += "$($disk.DeviceID)=$free/$total GB"
              }

              $storageText = $storageStatus -join " | "

              # ----------------------------------------------------
              # NETWORK TEST
              # ----------------------------------------------------
              $networkOK = $false

              try {
                  $networkTest = Test-NetConnection `
                    -ComputerName "8.8.8.8" `
                    -Port 443 `
                    -WarningAction SilentlyContinue `
                    -InformationLevel Quiet

                  $networkOK = $networkTest
              }
              catch {
                  $networkOK = $false
              }

              if ($networkOK) {
                  $networkStatus = "ONLINE"
              }
              else {
                  $networkStatus = "CHECK"
              }

              # ----------------------------------------------------
              # LIVE LOG
              # ----------------------------------------------------
              Write-Host ""
              Write-Host "------------------------------------------------------------"

              Write-Host `
                "[$istStr IST | $utcStr UTC] " +
                "UPTIME=$uptimeStr | " +
                "CPU=$cpuLoad% | " +
                "RAM=$ramUsagePercent% | " +
                "DISK=$storageText | " +
                "NETWORK=$networkStatus"

              Write-Host "------------------------------------------------------------"

              Start-Sleep -Seconds 300
          }

      # ============================================================
      # 09 - CLEANUP
      # ============================================================
      - name: "09 | Cleanup Tailscale"
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    CLEANUP"
          Write-Host "============================================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tailscale) {

              Write-Host "Disconnecting Tailscale..."

              & $tailscale logout

              Write-Host "Tailscale : DISCONNECTED"
          }
          else {

              Write-Host "Tailscale executable not found."
              Write-Host "Cleanup skipped."
          }

          Write-Host ""
          Write-Host "Cleanup complete."
          Write-Host "============================================================"
          Write-Host ""
