name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 01 | RUNNER INFORMATION
      # ============================================================
      - name: "01 | Runner Information"
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "RUNNER INFORMATION"
          Write-Host "============================================================"

          Write-Host "Computer Name : $env:COMPUTERNAME"
          Write-Host "OS            : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "CPU           : $((Get-CimInstance Win32_Processor | Select-Object -First 1).Name)"
          Write-Host "Logical CPUs  : $((Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors)"

          $ramGB = [math]::Round(
            (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
            2
          )

          Write-Host "RAM           : $ramGB GB"
          Write-Host ""

          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Root -match '^[A-Z]:\\$' } |
            ForEach-Object {
              $total = [math]::Round(
                ($_.Used + $_.Free) / 1GB,
                2
              )

              $free = [math]::Round(
                $_.Free / 1GB,
                2
              )

              Write-Host "$($_.Name): Total $total GB | Free $free GB"
            }

          Write-Host "============================================================"


      # ============================================================
      # 02 | CONFIGURE RDP
      # ============================================================
      - name: "02 | Configure RDP"
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "CONFIGURING REMOTE DESKTOP"
          Write-Host "============================================================"

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0

          # RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0

          # Enable RDP firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Enable-NetFirewallRule

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          Write-Host "[ OK ] RDP enabled."
          Write-Host "[ OK ] Firewall configured."
          Write-Host "[ OK ] Remote Desktop service restarted."


      # ============================================================
      # 03 | CONFIGURE RDP USER
      # ============================================================
      - name: "03 | Configure RDP User"
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "============================================================"
          Write-Host "CONFIGURING RDP USER"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
            Write-Error "RDP_USERNAME secret is missing."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD secret is missing."
            exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Write-Host "[ INFO ] User already exists. Updating password."

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "GitHub Actions RDP User" |
              Out-Null

            Write-Host "[ OK ] RDP user created."
          }

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "[ OK ] User added to Administrators."
          Write-Host "[ OK ] User added to Remote Desktop Users."


      # ============================================================
      # 04 | INSTALL TAILSCALE
      # ============================================================
      - name: "04 | Install Tailscale"
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "TAILSCALE"
          Write-Host "============================================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tailscale) {
            Write-Host "[ OK ] Tailscale already installed."
          }
          else {
            $installer = "$env:TEMP\tailscale-installer.msi"

            Write-Host "[ INFO ] Downloading Tailscale 1.82.0..."

            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
              -OutFile $installer

            Write-Host "[ OK ] Download completed."

            Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList "/i `"$installer`" /qn /norestart" `
              -Wait `
              -NoNewWindow

            Remove-Item `
              $installer `
              -Force `
              -ErrorAction SilentlyContinue

            if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
            }

            Write-Host "[ OK ] Tailscale installed."
          }


      # ============================================================
      # 05 | CONNECT TAILSCALE
      # ============================================================
      - name: "05 | Connect Tailscale"
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "============================================================"
          Write-Host "CONNECTING TO TAILSCALE"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "TAILSCALE_AUTH_KEY secret is missing."
            exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Hostname : $hostname"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          # IMPORTANT:
          # Capture the native command exit code immediately.
          $tailscaleExitCode = $LASTEXITCODE

          if ($tailscaleExitCode -ne 0) {
            Write-Error "Tailscale failed to connect. Exit code: $tailscaleExitCode"
            exit $tailscaleExitCode
          }

          Start-Sleep -Seconds 5

          $tailscaleIP = & $tailscale ip -4 |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($tailscaleIP)) {
            Write-Error "Could not obtain Tailscale IPv4 address."
            exit 1
          }

          $tailscaleIP = $tailscaleIP.Trim()

          "TAILSCALE_IP=$tailscaleIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "TAILSCALE"
          Write-Host "  Status   : CONNECTED"
          Write-Host "  IPv4     : $tailscaleIP"
          Write-Host "  Hostname : $hostname"
          Write-Host "Status : SUCCESS"


      # ============================================================
      # 06 | VERIFY RDP
      # ============================================================
      - name: "06 | Verify RDP"
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "VERIFYING RDP"
          Write-Host "============================================================"

          Start-Sleep -Seconds 5

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "RDP Port : 3389"
          Write-Host "Listening: $($result.TcpTestSucceeded)"

          if (-not $result.TcpTestSucceeded) {
            Write-Error "RDP port 3389 is not reachable."
            exit 1
          }

          Write-Host "[ OK ] RDP port 3389 is OPEN."


      # ============================================================
      # 07 | TELEGRAM NOTIFICATION
      # ============================================================
      - name: "07 | Telegram Notification"
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          Write-Host "============================================================"
          Write-Host "TELEGRAM NOTIFICATION"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN)) {
            Write-Error "TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Error "TELEGRAM_CHAT_ID secret is missing."
            exit 1
          }

          $computerName = "gh-runner-$env:GITHUB_RUN_ID"

          $cpuCount = (
            Get-CimInstance Win32_Processor |
            Measure-Object -Property NumberOfLogicalProcessors -Sum
          ).Sum

          $ramGB = [math]::Round(
            (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,
            2
          )

          $storageLines = @()

          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Root -match '^[A-Z]:\\$' } |
            ForEach-Object {
              $total = [math]::Round(
                ($_.Used + $_.Free) / 1GB,
                2
              )

              $free = [math]::Round(
                $_.Free / 1GB,
                2
              )

              $storageLines += "$($_.Name): $free GB free / $total GB"
            }

          $storage = $storageLines -join "`n"

          $message = @(
            "RDP SERVER ONLINE"
            ""
            "Server"
            "$computerName"
            ""
            "Tailscale IP"
            "$env:TAILSCALE_IP"
            ""
            "RDP Port"
            "3389"
            ""
            "Username"
            "$env:RDP_USERNAME"
            ""
            "CPU"
            "$cpuCount logical cores"
            ""
            "RAM"
            "$ramGB GB"
            ""
            "Storage"
            "$storage"
            ""
            "Maximum Runtime"
            "6 Hours"
            ""
            "Repository"
            "$env:GITHUB_REPOSITORY"
            ""
            "Run ID"
            "$env:GITHUB_RUN_ID"
            ""
            "Status"
            "READY"
          ) -join "`n"

          $response = Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
            -Method Post `
            -Body @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = $message
            }

          if (-not $response.ok) {
            Write-Error "Telegram API rejected the message: $($response.description)"
            exit 1
          }

          Write-Host "[ OK ] Telegram notification sent successfully."


      # ============================================================
      # 08 | RDP READY
      # ============================================================
      - name: "08 | RDP Ready"
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP SERVER READY"
          Write-Host "============================================================"
          Write-Host "Server       : gh-runner-$env:GITHUB_RUN_ID"
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Runtime      : 6 Hours"
          Write-Host "Status       : READY"
          Write-Host "============================================================"
          Write-Host ""


      # ============================================================
      # 09 | LIVE MONITOR
      # ============================================================
      - name: "09 | Live Monitor"
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "LIVE RDP MONITOR"
          Write-Host "============================================================"
          Write-Host "The runner will remain online until the 6-hour job timeout."
          Write-Host ""

          $startTime = Get-Date

          while ($true) {

            $now = Get-Date

            $uptime = $now - $startTime

            $cpu = Get-CimInstance Win32_Processor |
              Measure-Object -Property LoadPercentage -Average

            $cpuUsage = [math]::Round(
              $cpu.Average,
              1
            )

            $memory = Get-CimInstance Win32_OperatingSystem

            $totalMemory = [math]::Round(
              $memory.TotalVisibleMemorySize / 1MB,
              2
            )

            $freeMemory = [math]::Round(
              $memory.FreePhysicalMemory / 1MB,
              2
            )

            $usedMemory = [math]::Round(
              $totalMemory - $freeMemory,
              2
            )

            $memoryUsage = [math]::Round(
              ($usedMemory / $totalMemory) * 100,
              1
            )

            $rdp = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 3389 `
              -WarningAction SilentlyContinue

            Write-Host ""
            Write-Host "------------------------------------------------------------"
            Write-Host "TIME"
            Write-Host "UTC : $($now.ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))"
            Write-Host "IST : $($now.ToUniversalTime().AddHours(5.5).ToString('yyyy-MM-dd HH:mm:ss'))"

            Write-Host ""
            Write-Host "UPTIME"
            Write-Host "Elapsed : $($uptime.ToString('dd\.hh\:mm\:ss'))"

            Write-Host ""
            Write-Host "CPU"
            Write-Host "Usage : $cpuUsage %"

            Write-Host ""
            Write-Host "MEMORY"
            Write-Host "Used : $usedMemory GB / $totalMemory GB"
            Write-Host "Usage: $memoryUsage %"

            Write-Host ""
            Write-Host "STORAGE"

            Get-PSDrive -PSProvider FileSystem |
              Where-Object { $_.Root -match '^[A-Z]:\\$' } |
              ForEach-Object {

                $total = [math]::Round(
                  ($_.Used + $_.Free) / 1GB,
                  2
                )

                $free = [math]::Round(
                  $_.Free / 1GB,
                  2
                )

                $used = [math]::Round(
                  $_.Used / 1GB,
                  2
                )

                Write-Host "$($_.Name): Used $used GB | Free $free GB | Total $total GB"
              }

            Write-Host ""
            Write-Host "NETWORK"
            Write-Host "Tailscale IP : $env:TAILSCALE_IP"

            Write-Host ""
            Write-Host "RDP"
            Write-Host "Port 3389 : $($rdp.TcpTestSucceeded)"

            Write-Host "------------------------------------------------------------"

            Start-Sleep -Seconds 300
          }


      # ============================================================
      # 10 | CLEANUP
      # ============================================================
      - name: "10 | Cleanup Tailscale"
        if: always()
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "CLEANUP"
          Write-Host "============================================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tailscale) {
            Write-Host "[ INFO ] Disconnecting Tailscale..."

            & $tailscale logout

            Write-Host "[ OK ] Tailscale disconnected."
          }
          else {
            Write-Host "[ INFO ] Tailscale executable not found."
          }

          Write-Host "Cleanup completed."
