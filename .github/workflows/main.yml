- name: Test Telegram Bot
  shell: powershell
  run: |

    $message = "
🚀 Telegram Bot Connected

Repository:
${{ github.repository }}

Run:
${{ github.run_id }}

Status:
Online
"

    Invoke-RestMethod `
    -Uri "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" `
    -Method Post `
    -Body @{
        chat_id="${{ secrets.TELEGRAM_CHAT_ID }}"
        text=$message
    }
