name: RDP Workspace (Phase 1)
on: [workflow_dispatch]

jobs:
  workspace:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bootstrap Workspace
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: ./core/Bootstrap.ps1

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $installer = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $installer
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -NoNewWindow
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="rdp-workspace-test"
          Write-Host "Tailscale connected: $(& $ts ip -4)"

      - name: Keep-Alive (Testing Mode)
        shell: pwsh
        run: |
          Write-Host "Workspace ready. Keeping runner alive for 30 minutes for manual verification..."
          Start-Sleep -Seconds 1800
