name: RDP Workspace (Phase 8)

on:
  workflow_dispatch:
    inputs:
      is_relay:
        description: 'Is this an automated relay run?'
        required: false
        default: 'false'

jobs:
  workspace:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      IS_RELAY: ${{ github.event.inputs.is_relay }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bootstrap Workspace & Restore Cloud State
        run: ./core/Bootstrap.ps1
        shell: powershell

      - name: BotService Keep-Alive & Relay Engine
        run: ./core/BotService.ps1
        shell: powershell
