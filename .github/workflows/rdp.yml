name: RDP Workspace (Phase 8.6 - Cloud Native)

on:
  workflow_dispatch:
    inputs:
      is_relay:
        description: 'Is this an automated relay run?'
        required: false
        default: 'false'

jobs:
  workspace:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      # THE MASTER KEY: The only secret GitHub needs to unlock your CloudVault!
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      IS_RELAY: ${{ github.event.inputs.is_relay }}
      GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bootstrap Workspace & Restore Cloud State
        run: ./core/Bootstrap.ps1
        shell: pwsh

      - name: BotService Keep-Alive & Relay Engine
        run: ./core/BotService.ps1
        shell: pwsh
