name: RDP Workspace (Phase 9.0)

on:
  workflow_dispatch:
    inputs:
      is_relay:
        description: 'Is this an automated relay run?'
        required: false
        type: boolean
        default: false
      rdp_credential_mode:
        description: 'RDP credentials: use existing default or custom GitHub repository secrets'
        required: true
        type: choice
        options:
          - default
          - custom
        default: default

jobs:
  workspace:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      IS_RELAY: ${{ inputs.is_relay }}
      RDP_CREDENTIAL_MODE: ${{ inputs.rdp_credential_mode }}
      RDP_CUSTOM_USERNAME: ${{ secrets.RDP_CUSTOM_USERNAME }}
      RDP_CUSTOM_PASSWORD: ${{ secrets.RDP_CUSTOM_PASSWORD }}
      GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bootstrap Workspace & Restore Cloud State
        run: ./core/Bootstrap.ps1
        shell: pwsh

      - name: BotService Keep-Alive & Relay Engine
        run: ./core/BotService.ps1
        shell: pwsh
